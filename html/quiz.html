<script>
    // Initialize quiz functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Make sure all quiz cards have data-id attributes
        document.querySelectorAll('.quiz-card').forEach((card, index) => {
            card.dataset.id = index + 1;
            
            // Add data-id to buttons if not present
            const startBtn = card.querySelector('.start-btn');
            const retakeBtn = card.querySelector('.retake-btn');
            const detailsBtn = card.querySelector('.details-btn');
            
            if (startBtn) startBtn.dataset.id = index + 1;
            if (retakeBtn) retakeBtn.dataset.id = index + 1;
            if (detailsBtn) detailsBtn.dataset.id = index + 1;
        });
        
        // Initialize search functionality
        const searchInput = document.getElementById('quizSearch');
        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const quizzes = document.querySelectorAll('.quiz-card');
                
                quizzes.forEach(quiz => {
                    const title = quiz.querySelector('.quiz-title').textContent.toLowerCase();
                    const subtitle = quiz.querySelector('.quiz-subtitle').textContent.toLowerCase();
                    
                    if (title.includes(searchTerm) || subtitle.includes(searchTerm)) {
                        quiz.style.display = 'block';
                    } else {
                        quiz.style.display = 'none';
                    }
                });
            });
        }
        
        // Add active class to first filter tab
        const firstTab = document.querySelector('.filter-tab');
        if (firstTab) firstTab.classList.add('active');
    });
</script>
